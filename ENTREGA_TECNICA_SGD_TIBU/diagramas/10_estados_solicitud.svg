8" y2="166.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3789" x="612.1777" y="158.6426">rechazada</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.0332" x="589.5" y="184.1758">Decisi&#243;n terminal</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.7344" x="589.5" y="199.2695">No habilita entrega</text></g><ellipse cx="16" cy="135.1094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="797" cy="122.1094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="797" cy="122.1094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="16" data-uid="ent0003" id="entity_GMN2"><path d="M245,50.6094 L245,93.3125 A0,0 0 0 0 245,93.3125 L335.5,93.3125 L339.5,111.9727 L343.5,93.3125 L433.6543,93.3125 A0,0 0 0 0 433.6543,93.3125 L433.6543,60.6094 L423.6543,50.6094 L245,50.6094 A0,0 0 0 0 245,50.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M423.6543,50.6094 L423.6543,60.6094 L433.6543,60.6094 L423.6543,50.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.6543" x="251" y="69.1045">Se actualiza solo si el estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.6606" x="251" y="85.4561">persistido sigue pendiente.</text></g><g class="link" data-entity-1=".start." data-entity-2="Pendiente" data-uid="lnk3" id="link_.start._Pendiente"><polygon fill="#181818" points="298.3001,137.1094,289.3001,133.1094,293.3001,137.1094,289.3001,141.1094,298.3001,137.1094" style="stroke:#181818;stroke-width:1;"/><path d="M26.2751,137.1094 C66.016,137.1094 217.2958,137.1094 292.3001,137.1094" fill="none" style="st