name: Importar el codigo del SGD Tibu
on:
  push:
    branches: [main]
    paths:
      - 'SGD_TIBU_SUBIDA_GITHUB_PREPARADA.zip'
      - '.github/workflows/importar-sgd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer y comprobar el paquete publicado
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, stat
          root = pathlib.Path.cwd()
          package = root / 'SGD_TIBU_SUBIDA_GITHUB_PREPARADA.zip'
          expected = 'e2e05b342517339470c5e3e6bf28d569fbe3cacc04a86252a093348842ad1fc2'
          if hashlib.sha256(package.read_bytes()).hexdigest() != expected:
              raise SystemExit('ERROR: el ZIP no coincide con el paquete verificado.')
          count = 0
          with zipfile.ZipFile(package) as z:
              entries = z.infolist()
              for item in entries:
                  if not item.filename.startswith('CODIGO_SGD_TIBU/') or item.is_dir():
                      continue
                  name = item.filename[len('CODIGO_SGD_TIBU/'):]
                  pure = pathlib.PurePosixPath(name)
                  if not name or pure.is_absolute() or '..' in pure.parts or '\\' in name:
                      raise SystemExit('Ruta no permitida')
                  if pure.parts[0] == '.git':
                      raise SystemExit('Directorio .git no permitido')
                  if (item.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise SystemExit('Enlace simbolico no permitido')
                  target = root.joinpath(*pure.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
                  count += 1
          if count != 271:
              raise SystemExit(f'Numero inesperado de archivos: {count}')
          (root / 'SGD_TIBU_SUBIDA_GITHUB_PREPARADA.zip').unlink()
          (root / '.github/workflows/importar-sgd.yml').unlink()
          print(f'Listo: {count} archivos del SGD Tibu extraidos a la raiz.')
          PY
      - name: Registrar el codigo fuente en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importar codigo fuente SGD Tibu 3.1.0 y documentacion" || exit 0
          git push origin HEAD:main
